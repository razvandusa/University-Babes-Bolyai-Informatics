plugins {
    id 'java'
    id 'application'
    //id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
//    testImplementation platform('org.junit:junit-bom:6.0.0')
//    testImplementation 'org.junit.jupiter:junit-jupiter'
//    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//
//    implementation "org.openjfx:javafx-controls:21.0.4"
//    implementation "org.openjfx:javafx-fxml:21.0.4"
//
//    implementation 'org.postgresql:postgresql:42.7.3'
//    implementation 'org.hibernate.orm:hibernate-hikaricp:7.3.2.Final'
//    implementation 'com.zaxxer:HikariCP:5.1.0'
//    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
//
//    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//    implementation 'org.springframework.boot:spring-boot-starter-cache'
//
//    implementation 'com.github.ben-manes.caffeine:caffeine'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 2. JavaFX
    implementation "org.openjfx:javafx-controls:21.0.4"
    implementation "org.openjfx:javafx-fxml:21.0.4"

    // 3. Database & Persistence
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 4. Caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // 5. Liquibase
    implementation 'org.liquibase:liquibase-core:5.0.3'
}

test {
    useJUnitPlatform()
}

//javafx {
//    version = "21.0.4"
//    modules = ['javafx.controls', 'javafx.fxml']
//}

application {
    mainClass = 'org.example.MainApp'
}